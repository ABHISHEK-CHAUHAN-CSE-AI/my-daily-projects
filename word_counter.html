<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Word Counter</title>
    <style>
        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background: #0f172a;
            color: #f8fafc;
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
            margin: 0;
        }
        .card {
            background: #1e293b;
            padding: 25px;
            border-radius: 12px;
            box-shadow: 0 10px 25px rgba(0,0,0,0.5);
            width: 360px;
            text-align: center;
        }
        h2 { margin-top: 0; color: #38bdf8; }
        textarea {
            width: 100%;
            height: 120px;
            padding: 10px;
            border-radius: 8px;
            border: 1px solid #334155;
            background: #0f172a;
            color: #fff;
            box-sizing: border-box;
            resize: none;
            font-size: 0.95em;
        }
        .stats {
            display: flex;
            justify-content: space-around;
            margin-top: 15px;
        }
        .stat-box {
            background: #0f172a;
            padding: 10px 15px;
            border-radius: 8px;
            border: 1px solid #334155;
            min-width: 90px;
        }
        .stat-box span {
            display: block;
            font-size: 1.3em;
            font-weight: bold;
            color: #38bdf8;
        }
        .stat-box label {
            font-size: 0.8em;
            color: #94a3b8;
        }
    </style>
</head>
<body>
    <div class="card">
        <h2>Word & Character Counter</h2>
        <textarea id="textInput" placeholder="Type or paste your text here..." oninput="countText()"></textarea>
        <div class="stats">
            <div class="stat-box">
                <span id="wordCount">0</span>
                <label>Words</label>
            </div>
            <div class="stat-box">
                <span id="charCount">0</span>
                <label>Characters</label>
            </div>
        </div>
    </div>

    <script>
        function countText() {
            let text = document.getElementById('textInput').value.trim();
            let words = text ? text.split(/\s+/).length : 0;
            let chars = text.length;
            document.getElementById('wordCount').innerText = words;
            document.getElementById('charCount').innerText = chars;
        }
    </script>
</body>
</html>
