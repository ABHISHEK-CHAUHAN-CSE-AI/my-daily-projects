<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>AKTU Physics ST-3 Quick Revision Tracker</title>
    <style>
        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background-color: #0f172a;
            color: #f8fafc;
            max-width: 800px;
            margin: 40px auto;
            padding: 20px;
            line-height: 1.6;
        }
        header {
            text-align: center;
            border-bottom: 2px solid #38bdf8;
            padding-bottom: 15px;
            margin-bottom: 30px;
        }
        h1 {
            color: #38bdf8;
            margin: 0;
        }
        .card {
            background-color: #1e293b;
            border-left: 5px solid #22c55e;
            padding: 15px 20px;
            margin-bottom: 20px;
            border-radius: 6px;
        }
        .formula-box {
            background-color: #0f172a;
            border: 1px dashed #38bdf8;
            padding: 10px;
            font-family: monospace;
            font-size: 1.1rem;
            color: #fbbf24;
            margin-top: 10px;
            text-align: center;
        }
        .checkbox-label {
            display: flex;
            align-items: center;
            gap: 10px;
            font-weight: bold;
            font-size: 1.1rem;
            cursor: pointer;
        }
        input[type="checkbox"] {
            width: 18px;
            height: 18px;
            accent-color: #22c55e;
        }
    </style>
</head>
<body>

    <header>
        <h1>AKTU Physics (BAS101) - ST-3 Revision</h1>
        <p>Daily Code & Exam Survival Checklist</p>
    </header>

    <div class="card">
        <label class="checkbox-label">
            <input type="checkbox"> 1. Particle in 1-D Potential Box (Energy Eigenvalues)
        </label>
        <div class="formula-box">E_n = (n² * h²) / (8 * m * L²)</div>
    </div>

    <div class="card">
        <label class="checkbox-label">
            <input type="checkbox"> 2. Optical Fiber: Numerical Aperture & V-Number
        </label>
        <div class="formula-box">NA = √(n₁² - n₂²) &nbsp;|&nbsp; V = (π * d / λ) * NA</div>
    </div>

    <div class="card">
        <label class="checkbox-label">
            <input type="checkbox"> 3. Compton Effect & Wavelength Shift
        </label>
        <div class="formula-box">Δλ = (h / m₀c) * (1 - cosθ)</div>
    </div>

    <div class="card">
        <label class="checkbox-label">
            <input type="checkbox"> 4. Einstein's Coefficients Relation
        </label>
        <div class="formula-box">A₂₁ / B₂₁ = (8 * π * h * ν³) / c³</div>
    </div>

</body>
</html>
