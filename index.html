<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Daily Practice Component</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
        }

        body {
            background-color: #0f172a;
            color: #f8fafc;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
        }

        .card {
            background: #1e293b;
            padding: 24px;
            border-radius: 12px;
            border: 1px solid #334155;
            width: 320px;
            box-shadow: 0 10px 25px rgba(0, 0, 0, 0.3);
            text-align: center;
        }

        .card h2 {
            color: #38bdf8;
            margin-bottom: 8px;
            font-size: 20px;
        }

        .card p {
            color: #94a3b8;
            font-size: 14px;
            margin-bottom: 18px;
            line-height: 1.4;
        }

        .btn {
            display: inline-block;
            background: #0284c7;
            color: white;
            padding: 10px 20px;
            border-radius: 6px;
            text-decoration: none;
            font-weight: 600;
            transition: background 0.2s ease;
        }

        .btn:hover {
            background: #0369a1;
        }
    </style>
</head>
<body>

    <div class="card">
        <h2>Daily Practice</h2>
        <p>Responsive profile card layout built using HTML5 and modern CSS flexbox.</p>
        <a href="#" class="btn">View Project</a>
    </div>

</body>
</html>
