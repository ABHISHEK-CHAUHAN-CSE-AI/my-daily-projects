<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Diamond Protocol - Progress Tracker</title>
    <style>
        body {
            background-color: #0d1117;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
            margin: 0;
        }
        .tracker-card {
            background: #161b22;
            padding: 24px;
            border-radius: 12px;
            border: 1px solid #30363d;
            box-shadow: 0 8px 24px rgba(0, 0, 0, 0.4);
            width: 320px;
            color: #c9d1d9;
        }
        .tracker-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 12px;
        }
        .title {
            font-size: 16px;
            font-weight: 600;
            color: #f0f6fc;
        }
        .percentage {
            font-size: 14px;
            color: #58a6ff;
            font-weight: bold;
        }
        .progress-bar-bg {
            background: #21262d;
            border-radius: 10px;
            height: 10px;
            overflow: hidden;
        }
        .progress-bar-fill {
            background: linear-gradient(90deg, #238636, #2ea043);
            height: 100%;
            width: 85%;
            border-radius: 10px;
        }
    </style>
</head>
<body>
    <div class="tracker-card">
        <div class="tracker-header">
            <span class="title">Diamond Streak Goal</span>
            <span class="percentage">85%</span>
        </div>
        <div class="progress-bar-bg">
            <div class="progress-bar-fill"></div>
        </div>
    </div>
</body>
</html>
