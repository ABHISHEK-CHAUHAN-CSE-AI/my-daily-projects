<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Abhishek Chauhan | Diamond Protocol</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
        }
        body {
            background: linear-gradient(135deg, #0f172a, #1e293b);
            height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            color: #f8fafc;
        }
        .card {
            background: rgba(30, 41, 59, 0.7);
            backdrop-filter: blur(12px);
            border: 1px solid rgba(255, 255, 255, 0.1);
            padding: 40px;
            border-radius: 20px;
            text-align: center;
            box-shadow: 0 20px 25px -5px rgba(0, 0, 0, 0.5);
            max-width: 400px;
            width: 100%;
        }
        .card h1 {
            font-size: 24px;
            margin-bottom: 10px;
            color: #38bdf8;
        }
        .card p {
            font-size: 14px;
            color: #94a3b8;
            margin-bottom: 20px;
        }
        .badge {
            display: inline-block;
            background: #0284c7;
            color: white;
            padding: 6px 14px;
            border-radius: 50px;
            font-size: 12px;
            font-weight: 600;
            text-transform: uppercase;
            letter-spacing: 1px;
        }
    </style>
</head>
<body>

    <div class="card">
        <h1>Abhishek Chauhan</h1>
        <p>B.Tech CSE (AI) | Systems & Logic Developer</p>
        <span class="badge">Diamond Protocol Active</span>
    </div>

</body>
</html>
