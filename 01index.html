<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Daily Skill Progress Widget</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: 'Inter', -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
        }

        body {
            background-color: #0f172a;
            color: #f8fafc;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            padding: 20px;
        }

        .widget-card {
            background: #1e293b;
            border: 1px solid #334155;
            border-radius: 16px;
            width: 100%;
            max-width: 380px;
            padding: 24px;
            box-shadow: 0 20px 25px -5px rgba(0, 0, 0, 0.4);
        }

        .card-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 20px;
        }

        .card-header h3 {
            font-size: 18px;
            font-weight: 600;
            color: #38bdf8;
        }

        .badge {
            background: rgba(56, 189, 248, 0.1);
            color: #38bdf8;
            font-size: 12px;
            font-weight: 600;
            padding: 4px 10px;
            border-radius: 20px;
            border: 1px solid rgba(56, 189, 248, 0.2);
        }

        .skill-item {
            margin-bottom: 16px;
        }

        .skill-info {
            display: flex;
            justify-content: space-between;
            font-size: 14px;
            margin-bottom: 6px;
            color: #cbd5e1;
        }

        .progress-bar {
            width: 100%;
            height: 8px;
            background: #334155;
            border-radius: 10px;
            overflow: hidden;
        }

        .fill {
            height: 100%;
            border-radius: 10px;
            transition: width 0.4s ease;
        }

        .fill-c { width: 85%; background: #38bdf8; }
        .fill-html { width: 92%; background: #f97316; }
        .fill-python { width: 70%; background: #a855f7; }

        .footer-text {
            margin-top: 20px;
            text-align: center;
            font-size: 12px;
            color: #64748b;
        }
    </style>
</head>
<body>

    <div class="widget-card">
        <div class="card-header">
            <h3>Daily Learning Tracker</h3>
            <span class="badge">Active Streak</span>
        </div>

        <div class="skill-item">
            <div class="skill-info">
                <span>C Programming Logic</span>
                <span>85%</span>
            </div>
            <div class="progress-bar">
                <div class="fill fill-c"></div>
            </div>
        </div>

        <div class="skill-item">
            <div class="skill-info">
                <span>HTML5 & Modern CSS</span>
                <span>92%</span>
            </div>
            <div class="progress-bar">
                <div class="fill fill-html"></div>
            </div>
        </div>

        <div class="skill-item">
            <div class="skill-info">
                <span>Python Fundamentals</span>
                <span>70%</span>
            </div>
            <div class="progress-bar">
                <div class="fill fill-python"></div>
            </div>
        </div>

        <div class="footer-text">
            Updated via Daily GitHub Push
        </div>
    </div>

</body>
</html>
