<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Quick Notes App</title>
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; font-family: sans-serif; }
    body { background: #0f172a; color: #fff; display: flex; justify-content: center; padding-top: 40px; }
    .container { background: #1e293b; padding: 25px; border-radius: 12px; width: 340px; }
    h3 { color: #facc15; margin-bottom: 12px; }
    textarea { width: 100%; height: 90px; padding: 8px; border-radius: 6px; border: 1px solid #475569; background: #0f172a; color: #fff; resize: none; margin-bottom: 10px; }
    button { background: #facc15; border: none; color: #0f172a; padding: 8px 14px; border-radius: 6px; font-weight: bold; cursor: pointer; }
    .notes-list { margin-top: 15px; }
    .note { background: #334155; padding: 10px; border-left: 4px solid #facc15; border-radius: 4px; margin-bottom: 8px; font-size: 14px; word-break: break-word; }
  </style>
</head>
<body>
  <div class="container">
    <h3>📝 Quick Note Pad</h3>
    <textarea id="noteInput" placeholder="Write a note..."></textarea>
    <button onclick="saveNote()">Save Note</button>
    <div class="notes-list" id="notesList"></div>
  </div>
  <script>
    function saveNote() {
      let text = document.getElementById('noteInput').value;
      if (text.trim() !== "") {
        let div = document.createElement('div');
        div.className = 'note';
        div.textContent = text;
        document.getElementById('notesList').appendChild(div);
        document.getElementById('noteInput').value = "";
      }
    }
  </script>
</body>
</html>
