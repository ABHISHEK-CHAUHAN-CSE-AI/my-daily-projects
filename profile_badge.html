<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Diamond Protocol - Profile Badge</title>
    <style>
        body {
            background-color: #0d1117;
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
            margin: 0;
        }
        .badge-card {
            background: #161b22;
            border: 1px solid #30363d;
            border-radius: 12px;
            padding: 24px;
            width: 300px;
            text-align: center;
            color: #c9d1d9;
            box-shadow: 0 10px 25px rgba(0, 0, 0, 0.5);
        }
        .avatar {
            width: 80px;
            height: 80px;
            border-radius: 50%;
            background: linear-gradient(135deg, #58a6ff, #1f6feb);
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 32px;
            font-weight: bold;
            color: #ffffff;
            margin: 0 auto 16px auto;
        }
        .name {
            font-size: 20px;
            font-weight: 600;
            color: #f0f6fc;
            margin: 0 0 6px 0;
        }
        .role {
            font-size: 14px;
            color: #8b949e;
            margin: 0 0 16px 0;
        }
        .status {
            display: inline-block;
            padding: 6px 14px;
            background: rgba(46, 160, 67, 0.15);
            color: #3fb950;
            border: 1px solid rgba(46, 160, 67, 0.4);
            border-radius: 20px;
            font-size: 12px;
            font-weight: 600;
        }
    </style>
</head>
<body>
    <div class="badge-card">
        <div class="avatar">AC</div>
        <h3 class="name">Abhishek Chauhan</h3>
        <p class="role">CSE (AI) Student & Developer</p>
        <span class="status">⚡ Diamond Protocol Active</span>
    </div>
</body>
</html>
