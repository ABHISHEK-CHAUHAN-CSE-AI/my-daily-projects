<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Diamond Protocol - Skill Tags</title>
    <style>
        body {
            background-color: #0d1117;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
            margin: 0;
        }
        .tag-container {
            background: #161b22;
            padding: 24px;
            border-radius: 12px;
            border: 1px solid #30363d;
            box-shadow: 0 8px 24px rgba(0, 0, 0, 0.4);
            max-width: 400px;
            text-align: center;
        }
        .tag-title {
            color: #f0f6fc;
            font-size: 18px;
            margin-bottom: 16px;
        }
        .tags {
            display: flex;
            flex-wrap: wrap;
            gap: 10px;
            justify-content: center;
        }
        .tag {
            background: #21262d;
            color: #58a6ff;
            border: 1px solid rgba(56, 139, 253, 0.4);
            padding: 6px 14px;
            border-radius: 20px;
            font-size: 13px;
            font-weight: 600;
            transition: all 0.2s ease;
            cursor: pointer;
        }
        .tag:hover {
            background: #1f6feb;
            color: #ffffff;
            transform: translateY(-2px);
        }
    </style>
</head>
<body>
    <div class="tag-container">
        <div class="tag-title">Tech Stack Focus</div>
        <div class="tags">
            <span class="tag">C Language</span>
            <span class="tag">Pointers</span>
            <span class="tag">Structures</span>
            <span class="tag">HTML5 & CSS3</span>
            <span class="tag">Git & GitHub</span>
            <span class="tag">AI & Prompt Engg</span>
        </div>
    </div>
</body>
</html>
