<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Tip Calculator</title>
    <style>
        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background: #0f172a;
            color: #f8fafc;
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
            margin: 0;
        }
        .card {
            background: #1e293b;
            padding: 25px;
            border-radius: 12px;
            box-shadow: 0 10px 25px rgba(0,0,0,0.5);
            width: 320px;
            text-align: center;
        }
        h2 { margin-top: 0; color: #38bdf8; }
        input {
            width: 100%;
            padding: 10px;
            margin: 8px 0;
            border-radius: 6px;
            border: 1px solid #334155;
            background: #0f172a;
            color: #fff;
            box-sizing: border-box;
        }
        button {
            width: 100%;
            padding: 10px;
            margin-top: 10px;
            background: #0284c7;
            color: white;
            border: none;
            border-radius: 6px;
            cursor: pointer;
            font-weight: bold;
        }
        button:hover { background: #0369a1; }
        #result { margin-top: 15px; font-size: 1em; line-height: 1.5; }
    </style>
</head>
<body>
    <div class="card">
        <h2>Tip Calculator</h2>
        <input type="number" id="bill" placeholder="Bill Amount (₹)">
        <input type="number" id="tip" placeholder="Tip (%)">
        <input type="number" id="people" placeholder="Number of People">
        <button onclick="calculateTip()">Calculate Split</button>
        <div id="result"></div>
    </div>

    <script>
        function calculateTip() {
            let bill = parseFloat(document.getElementById('bill').value);
            let tipPercent = parseFloat(document.getElementById('tip').value);
            let people = parseInt(document.getElementById('people').value);

            if (bill > 0 && tipPercent >= 0 && people > 0) {
                let totalTip = (bill * (tipPercent / 100));
                let totalAmount = bill + totalTip;
                let perPerson = (totalAmount / people).toFixed(2);
                document.getElementById('result').innerHTML = `Total Bill: <b>₹${totalAmount.toFixed(2)}</b><br>Per Person: <b>₹${perPerson}</b>`;
            } else {
                document.getElementById('result').innerText = "Please enter valid values.";
            }
        }
    </script>
</body>
</html>
