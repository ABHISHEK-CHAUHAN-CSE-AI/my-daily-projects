<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Pricing Card UI</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
        }
        body {
            background-color: #0b0f19;
            color: #94a3b8;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
        }
        .pricing-card {
            background: #111827;
            border: 1px solid #1f2937;
            border-radius: 16px;
            padding: 32px;
            width: 320px;
            text-align: center;
            box-shadow: 0 10px 30px rgba(0, 0, 0, 0.5);
            transition: transform 0.3s ease;
        }
        .pricing-card:hover {
            transform: translateY(-5px);
            border-color: #3b82f6;
        }
        .plan-name {
            font-size: 20px;
            color: #ffffff;
            font-weight: 600;
            margin-bottom: 8px;
        }
        .price {
            font-size: 36px;
            color: #38bdf8;
            font-weight: bold;
            margin-bottom: 24px;
        }
        .price span {
            font-size: 14px;
            color: #64748b;
        }
        .features {
            list-style: none;
            margin-bottom: 24px;
            text-align: left;
        }
        .features li {
            padding: 8px 0;
            border-bottom: 1px solid #1f2937;
            font-size: 14px;
            color: #cbd5e1;
        }
        .btn {
            display: block;
            width: 100%;
            padding: 12px;
            background-color: #2563eb;
            color: white;
            border: none;
            border-radius: 8px;
            font-weight: 600;
            cursor: pointer;
            text-decoration: none;
            transition: background 0.2s;
        }
        .btn:hover {
            background-color: #1d4ed8;
        }
    </style>
</head>
<body>

    <div class="pricing-card">
        <div class="plan-name">Pro Developer</div>
        <div class="price">$19<span>/month</span></div>
        <ul class="features">
            <li>✓ Unlimited Repositories</li>
            <li>✓ Advanced Analytics</li>
            <li>✓ Priority Support</li>
            <li>✓ Custom Domains</li>
        </ul>
        <a href="#" class="btn">Choose Plan</a>
    </div>

</body>
</html>
