<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Skills Progress Card</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
        }
        body {
            background-color: #0d1117;
            color: #c9d1d9;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
        }
        .skills-card {
            background: #161b22;
            border: 1px solid #30363d;
            border-radius: 16px;
            padding: 32px;
            width: 360px;
            box-shadow: 0 8px 24px rgba(0, 0, 0, 0.4);
        }
        .skills-card h2 {
            font-size: 20px;
            color: #f0f6fc;
            margin-bottom: 20px;
            font-weight: 600;
            text-align: center;
        }
        .skill-item {
            margin-bottom: 18px;
        }
        .skill-info {
            display: flex;
            justify-content: space-between;
            font-size: 13px;
            margin-bottom: 6px;
            color: #8b949e;
        }
        .skill-info span:first-child {
            color: #f0f6fc;
            font-weight: 500;
        }
        .progress-bar {
            width: 100%;
            height: 8px;
            background: #21262d;
            border-radius: 4px;
            overflow: hidden;
        }
        .progress-fill {
            height: 100%;
            background: linear-gradient(90deg, #2563eb, #38bdf8);
            border-radius: 4px;
        }
        .c-lang { width: 85%; }
        .html-css { width: 90%; }
        .python { width: 75%; }
    </style>
</head>
<body>

    <div class="skills-card">
        <h2>Technical Proficiency</h2>
        
        <div class="skill-item">
            <div class="skill-info">
                <span>C Programming</span>
                <span>85%</span>
            </div>
            <div class="progress-bar">
                <div class="progress-fill c-lang"></div>
            </div>
        </div>

        <div class="skill-item">
            <div class="skill-info">
                <span>HTML & CSS</span>
                <span>90%</span>
            </div>
            <div class="progress-bar">
                <div class="progress-fill html-css"></div>
            </div>
        </div>

        <div class="skill-item">
            <div class="skill-info">
                <span>Python Basics</span>
                <span>75%</span>
            </div>
            <div class="progress-bar">
                <div class="progress-fill python"></div>
            </div>
        </div>
    </div>

</body>
</html>
