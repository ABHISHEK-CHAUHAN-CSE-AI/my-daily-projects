<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Contact Form</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
        }
        body {
            background-color: #0b0f19;
            color: #94a3b8;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
        }
        .form-container {
            background: #111827;
            border: 1px solid #1f2937;
            border-radius: 16px;
            padding: 32px;
            width: 350px;
            box-shadow: 0 10px 30px rgba(0, 0, 0, 0.5);
        }
        .form-container h2 {
            color: #ffffff;
            margin-bottom: 20px;
            font-size: 22px;
            text-align: center;
        }
        .input-group {
            margin-bottom: 16px;
        }
        .input-group label {
            display: block;
            font-size: 13px;
            margin-bottom: 6px;
            color: #cbd5e1;
        }
        .input-group input, .input-group textarea {
            width: 100%;
            padding: 10px;
            background: #1f2937;
            border: 1px solid #374151;
            border-radius: 8px;
            color: white;
            outline: none;
        }
        .input-group textarea {
            resize: none;
            height: 80px;
        }
        .btn-submit {
            width: 100%;
            padding: 12px;
            background-color: #2563eb;
            color: white;
            border: none;
            border-radius: 8px;
            font-weight: 600;
            cursor: pointer;
            transition: background 0.2s;
        }
        .btn-submit:hover {
            background-color: #1d4ed8;
        }
    </style>
</head>
<body>

    <div class="form-container">
        <h2>Get in Touch</h2>
        <div class="input-group">
            <label>Name</label>
            <input type="text" placeholder="Your Name">
        </div>
        <div class="input-group">
            <label>Email</label>
            <input type="email5" placeholder="Your Email">
        </div>
        <div class="input-group">
            <label>Message</label>
            <textarea placeholder="Your Message"></textarea>
        </div>
        <button class="btn-submit">Send Message</button>
    </div>

</body>
</html>
