<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Diamond Protocol - Skill Card</title>
    <style>
        body {
            background-color: #0f172a;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
            margin: 0;
        }
        .card {
            background: #1e293b;
            border: 1px solid #334155;
            border-radius: 16px;
            padding: 24px;
            width: 320px;
            color: #f8fafc;
            box-shadow: 0 10px 25px rgba(0, 0, 0, 0.5);
            transition: transform 0.3s ease;
        }
        .card:hover {
            transform: translateY(-5px);
        }
        .card-header {
            font-size: 20px;
            font-weight: 700;
            color: #38bdf8;
            margin-bottom: 8px;
        }
        .card-desc {
            font-size: 14px;
            color: #94a3b8;
            line-height: 1.5;
            margin-bottom: 16px;
        }
        .status-badge {
            display: inline-block;
            background: rgba(56, 189, 248, 0.1);
            color: #38bdf8;
            padding: 6px 12px;
            border-radius: 20px;
            font-size: 12px;
            font-weight: 600;
            border: 1px solid rgba(56, 189, 248, 0.3);
        }
    </style>
</head>
<body>
    <div class="card">
        <div class="card-header">C & Web Dev Journey</div>
        <div class="card-desc">Building strong core coding foundations step-by-step with continuous GitHub commits.</div>
        <div class="status-badge">⚡ Streak Active</div>
    </div>
</body>
</html>
