<!DOCTYPE html>
<html lang="hi">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Pomodoro Study Timer</title>
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; font-family: 'Segoe UI', sans-serif; }
    body { background: #0f172a; color: #f8fafc; display: flex; justify-content: center; align-items: center; min-height: 100vh; }
    .card { background: #1e293b; padding: 30px; border-radius: 16px; border: 1px solid #334155; text-align: center; width: 340px; box-shadow: 0 10px 25px rgba(0,0,0,0.5); }
    h2 { font-size: 20px; color: #38bdf8; margin-bottom: 10px; }
    p { font-size: 13px; color: #94a3b8; margin-bottom: 15px; }
    .timer { font-size: 52px; font-weight: bold; font-family: monospace; color: #facc15; margin-bottom: 20px; }
    .btns { display: flex; gap: 10px; justify-content: center; }
    button { padding: 10px 18px; border: none; border-radius: 8px; font-weight: bold; cursor: pointer; transition: 0.2s; }
    .start { background: #22c55e; color: white; }
    .pause { background: #f59e0b; color: white; }
    .reset { background: #ef4444; color: white; }
    button:hover { opacity: 0.9; }
  </style>
</head>
<body>
  <div class="card">
    <h2>🍅 Pomodoro Study Timer</h2>
    <p>25 Minute Study Focus Session</p>
    <div class="timer" id="timer">25:00</div>
    <div class="btns">
      <button class="start" onclick="startTimer()">Start</button>
      <button class="pause" onclick="pauseTimer()">Pause</button>
      <button class="reset" onclick="resetTimer()">Reset</button>
    </div>
  </div>
  <script>
    let timeLeft = 25 * 60;
    let timerId = null;

    function updateDisplay() {
      let mins = String(Math.floor(timeLeft / 60)).padStart(2, '0');
      let secs = String(timeLeft % 60).padStart(2, '0');
      document.getElementById('timer').innerText = `${mins}:${secs}`;
    }

    function startTimer() {
      if (timerId === null) {
        timerId = setInterval(() => {
          if (timeLeft > 0) {
            timeLeft--;
            updateDisplay();
          } else {
            clearInterval(timerId);
            alert("Focus Session Complete! Take a break.");
          }
        }, 1000);
      }
    }

    function pauseTimer() {
      clearInterval(timerId);
      timerId = null;
    }

    function resetTimer() {
      pauseTimer();
      timeLeft = 25 * 60;
      updateDisplay();
    }
  </script>
</body>
</html>
