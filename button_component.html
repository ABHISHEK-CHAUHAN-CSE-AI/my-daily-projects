<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Diamond Protocol - Interactive Element</title>
    <style>
        body {
            background: #0f172a;
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
            margin: 0;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
        }
        .diamond-btn {
            padding: 16px 36px;
            font-size: 16px;
            font-weight: bold;
            color: #ffffff;
            background: linear-gradient(135deg, #00ffcc, #007bff);
            border: none;
            border-radius: 30px;
            cursor: pointer;
            box-shadow: 0 5px 20px rgba(0, 255, 204, 0.4);
            transition: all 0.3s ease;
        }
        .diamond-btn:hover {
            transform: translateY(-3px);
            box-shadow: 0 8px 25px rgba(0, 255, 204, 0.7);
            background: linear-gradient(135deg, #007bff, #00ffcc);
        }
    </style>
</head>
<body>
    <button class="diamond-btn">Diamond Streak Active 🚀</button>
</body>
</html>
