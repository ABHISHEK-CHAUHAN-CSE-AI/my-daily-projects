<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Anshu Verma | Dev Links</title>
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; font-family: 'Segoe UI', sans-serif; }
    body { background: #0f172a; color: #f8fafc; display: flex; justify-content: center; align-items: center; min-height: 100vh; padding: 20px; }
    .card { background: #1e293b; padding: 32px; border-radius: 16px; max-width: 380px; width: 100%; text-align: center; box-shadow: 0 10px 25px rgba(0,0,0,0.4); border: 1px solid #334155; }
    .avatar { width: 80px; height: 80px; border-radius: 50%; background: #38bdf8; color: #0f172a; display: flex; align-items: center; justify-content: center; font-size: 28px; font-weight: bold; margin: 0 auto 16px; }
    h1 { font-size: 22px; margin-bottom: 6px; }
    p { color: #94a3b8; font-size: 14px; margin-bottom: 24px; }
    .links { display: flex; flex-direction: column; gap: 12px; }
    .link-btn { background: #334155; color: #38bdf8; padding: 12px; border-radius: 8px; text-decoration: none; font-weight: 600; transition: all 0.2s ease; border: 1px solid transparent; }
    .link-btn:hover { background: #38bdf8; color: #0f172a; transform: translateY(-2px); }
  </style>
</head>
<body>
  <div class="card">
    <div class="avatar">AV</div>
    <h1>Anshu Verma</h1>
    <p>B.Tech CSE Student & Web Developer</p>
    <div class="links">
      <a href="#" class="link-btn">🚀 My GitHub Projects</a>
      <a href="#" class="link-btn">💼 LinkedIn Profile</a>
      <a href="#" class="link-btn">🌐 Live Landing Page</a>
    </div>
  </div>
</body>
</html>
