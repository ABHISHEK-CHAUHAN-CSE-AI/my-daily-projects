<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Quick Exam &amp; Streak Checklist</title>
  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      font-family: "Segoe UI", Arial, sans-serif;
    }
    body {
      min-height: 100vh;
      display: flex;
      justify-content: center;
      align-items: center;
      background: linear-gradient(135deg, #0f172a, #1e293b);
      padding: 20px;
    }
    .box {
      width: 100%;
      max-width: 440px;
      background: #ffffff;
      color: #0f172a;
      border-radius: 14px;
      padding: 24px;
      box-shadow: 0 14px 32px rgba(0, 0, 0, 0.35);
    }
    .tag {
      display: inline-block;
      background: #dcfce7;
      color: #166534;
      font-size: 12px;
      font-weight: 700;
      padding: 4px 10px;
      border-radius: 999px;
      margin-bottom: 10px;
    }
    h1 {
      font-size: 20px;
      margin-bottom: 14px;
    }
    ul {
      list-style: none;
    }
    li {
      background: #f1f5f9;
      padding: 10px 12px;
      border-radius: 8px;
      margin-bottom: 8px;
      font-size: 14px;
      border-left: 4px solid #16a34a;
    }
  </style>
</head>
<body>
  <div class="box">
    <span class="tag">GitHub Streak • Active</span>
    <h1>Daily Exam Sprint Checklist</h1>
    <ul>
      <li><strong>Step 1:</strong> Original documents scan &amp; form ready</li>
      <li><strong>Step 2:</strong> C, Python &amp; BEE core topics revision</li>
      <li><strong>Step 3:</strong> Daily GitHub C &amp; HTML commit pushed</li>
    </ul>
  </div>
</body>
</html>
