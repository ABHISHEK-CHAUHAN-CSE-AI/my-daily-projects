<!DOCTYPE html>
<html lang="hi">
<head>

    <title>मेरी कोडिंग जर्नी</title>

            background: #0f172a;

            justify-content: center;
            align-items: center;
            height: 100vh;
            margin: 0;
        }
        .container {

    <div class="container">
        <h1>GitHub Daily Streak</h1>
        <p>प्रतिदिन C प्रोग्रामिंग और वेब डेवलपमेंट कोड कमिट करने का मेरा छोटासा प्रयास।</p>

</html>
