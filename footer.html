<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Modern Footer UI</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
        }
        body {
            background-color: #0d1117;
            color: #8b949e;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
        }
        .footer {
            background: #161b22;
            border: 1px solid #30363d;
            border-radius: 12px;
            padding: 24px;
            width: 400px;
            text-align: center;
        }
        .footer p {
            font-size: 14px;
            color: #c9d1d9;
            margin-bottom: 12px;
        }
        .footer-links {
            list-style: none;
            display: flex;
            justify-content: center;
            gap: 16px;
        }
        .footer-links a {
            color: #58a6ff;
            text-decoration: none;
            font-size: 13px;
        }
        .footer-links a:hover {
            text-decoration: underline;
        }
    </style>
</head>
<body>

    <footer class="footer">
        <p>&copy; 2026 Abhishek Chauhan. All rights reserved.</p>
        <ul class="footer-links">
            <li><a href="#">GitHub</a></li>
            <li><a href="#">LinkedIn</a></li>
            <li><a href="#">Projects</a></li>
        </ul>
    </footer>

</body>
</html>
