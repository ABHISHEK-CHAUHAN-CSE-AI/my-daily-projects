<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>AKTU Odd Sem Exam Tracker</title>
  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      font-family: Arial, sans-serif;
    }
    body {
      min-height: 100vh;
      display: flex;
      justify-content: center;
      align-items: center;
      background: linear-gradient(135deg, #141e30, #243b55);
      padding: 20px;
    }
    .card {
      background: #ffffff;
      color: #1e293b;
      max-width: 420px;
      width: 100%;
      border-radius: 14px;
      padding: 24px;
      box-shadow: 0 12px 30px rgba(0, 0, 0, 0.3);
    }
    .badge {
      display: inline-block;
      background: #e0f2fe;
      color: #0369a1;
      font-size: 12px;
      font-weight: bold;
      padding: 5px 10px;
      border-radius: 999px;
      margin-bottom: 12px;
    }
    h1 {
      font-size: 20px;
      margin-bottom: 14px;
    }
    .milestone {
      background: #f8fafc;
      border-left: 4px solid #2563eb;
      padding: 10px 12px;
      margin-bottom: 10px;
      border-radius: 6px;
      font-size: 14px;
    }
    .milestone strong {
      display: block;
      color: #0f172a;
    }
  </style>
</head>
<body>
  <div class="card">
    <span class="badge">B.Tech CSE (AI) • Sem 1</span>
    <h1>AKTU Odd Sem Sprint</h1>
    <div class="milestone">
      <strong>Exam Form Deadline</strong>
      27 Nov 2026 (Original scans ready)
    </div>
    <div class="milestone">
      <strong>Theory Exams Window</strong>
      First Week of Dec 2026
    </div>
    <div class="milestone">
      <strong>Daily Focus</strong>
      C, Python, BEE &amp; IKS Revision
    </div>
  </div>
</body>
</html>
