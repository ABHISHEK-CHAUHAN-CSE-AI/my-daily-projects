<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Student Profile Card</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            background-color: #f4f6f9;
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
            margin: 0;
        }
        .card {
            background: #ffffff;
            padding: 25px 30px;
            border-radius: 10px;
            box-shadow: 0 4px 10px rgba(0, 0, 0, 0.1);
            text-align: center;
            width: 300px;
        }
        h2 {
            margin-bottom: 8px;
            color: #222;
        }
        p {
            color: #555;
            margin: 5px 0;
        }
        .tag {
            display: inline-block;
            margin-top: 12px;
            padding: 6px 14px;
            background-color: #007bff;
            color: white;
            border-radius: 20px;
            font-size: 14px;
        }
    </style>
</head>
<body>
    <div class="card">
        <h2>Abhishek Chauhan</h2>
        <p>B.Tech CSE (AI) - 1st Year</p>
        <p>Learning C &amp; Web Development</p>
        <span class="tag">GitHub Practice</span>
    </div>
</body>
</html>
